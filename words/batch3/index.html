 try{const r=await fetch(`https://api.cloudinary.com/v1_1/${C.CLOUD_NAME}/video/upload`,{method:'POST',body:f});return (await r.json()).secure_url||''}catch(e){return''}}
async function sendAll(){if(!meForm.classList.contains('hide')&&(nm.value.trim()||area.value))saveMe();
 const jobs=[];let n=0;
 W.forEach((w,k)=>{const ch=[...document.querySelectorAll('#c'+k+' .sel')].map(b=>b.textContent),t=document.getElementById('i'+k).value.trim();
  const p=[...ch,t].filter(x=>x).filter((x,j,a)=>a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===j).join(' || ');
  if(p||blobs[k]){n++;jobs.push(upload(w,k).then(a=>post({id:w.id,en:w.en,pon:p+(a?` [audio: ${a}]`:''),right:''})))}});
 if(!n){msg.textContent='Type at least one word first 🙂';return}
 send.disabled=true;send.textContent='Sending…';await Promise.all(jobs);
 send.classList.add('hide');msg.textContent='';dn.textContent=`You sent ${n} word${n>1?'s':''}.`;done.classList.remove('hide');done.scrollIntoView({behavior:'smooth'})}
function again(){done.classList.add('hide');send.classList.remove('hide');send.disabled=false;send.textContent='Send my words ✓';for(const k in blobs)delete blobs[k];render();window.scrollTo(0,0)}
function share(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(URL_),'_blank')}
function nshare(){if(navigator.share)navigator.share({title:document.title,text:'Help us learn Pohnpeian!',url:URL_}).catch(()=>{});else share()}

function fb(){const t=fbt.value.trim();if(!t)return;post({id:'PAGE_FEEDBACK',en:'page feedback',pon:t,right:''});fbt.value='';fbb.textContent='Thanks!'}
