let mine=0,i=0,ans,rec,chunks,blob,audioUrl;
const canRec=!/PLACEHOLDER/.test(C.CLOUD_NAME+C.UPLOAD_PRESET)&&location.protocol==='https:'&&navigator.mediaDevices&&window.MediaRecorder;
function post(o){if(!C.SUBMIT_ENABLED){console.log('would submit',o);return}const f=new URLSearchParams();
 [['WORDID',o.id],['ENGLISH',o.en],['PON',o.pon],['RIGHT',o.right],['AREA',area.value],['NAME',nm.value.trim()+(ct.value.trim()?' | '+ct.value.trim():'')]].forEach(([k,v])=>f.append(C['ENTRY_'+k],v||''));
 fetch(C.FORM_URL,{method:'POST',mode:'no-cors',body:f}).catch(()=>{})}
function start(){localStorage.wqName=nm.value;localStorage.wqCt=ct.value;intro.classList.add('hide');quiz.classList.remove('hide');pt.textContent=W.length;show()}
function show(){const w=W[i];ans={right:''};blob=null;pn.textContent=i+1;pb.style.width=(i/W.length*100)+'%';
 card.innerHTML=`<img src="data:image/png;base64,${w.img}" alt="" width="160" height="160"><div class="word">${w.icon} ${w.en}</div><p>${bi('how_say')}</p><input id="pon" autocapitalize="off" oninput="ans.right=W[i].sug?(this.value.trim().toLowerCase()===W[i].sug.toLowerCase()?'yes':'no'):''">`+
 (w.sug?`<div class="small">${S.dict_says.pon} / ${S.dict_says.en} <button onclick="pon.value=W[i].sug;ans.right='yes'">${w.sug} ✓</button></div>`:'')+
 `<div><a href="#" class="lk" onclick="lw.classList.toggle('hide');return false">${S.not_pon.pon} / ${S.not_pon.en}</a><div id="lw" class="${lang.value==='Pohnpeian'?'hide':''}"><select id="cl" onchange="lang.value=this.value;lo.classList.toggle('hide',this.value!=='Other')">${LANGS.map(l=>`<option ${l===lang.value?'selected':''}>${l}</option>`).join('')}</select><input id="lo" class="${lang.value==='Other'?'':'hide'}" placeholder="Language name"></div></div>`+
 (canRec?`<div><button id="mic" onclick="recT()">🎙️</button> <button id="pl" class="hide" onclick="new Audio(URL.createObjectURL(blob)).play()">▶️ ${bi('play')}</button><div class="small" id="rb">${S.record.pon} / ${S.record.en}<br>${S.consent.pon} / ${S.consent.en}</div></div>`:'')+
 `<button class="go" onclick="next()">${bi('next')} →</button>`;pon.focus()}
function pick(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');ans.right=b.dataset.r}
async function recT(){if(rec&&rec.state==='recording'){rec.stop();return}
 const st=await navigator.mediaDevices.getUserMedia({audio:true});const mt=MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'audio/webm';
 rec=new MediaRecorder(st,{mimeType:mt});chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{blob=new Blob(chunks,{type:mt});st.getTracks().forEach(t=>t.stop());mic.textContent='🔁';rb.innerHTML=S.rerecord.pon+' / '+S.rerecord.en;pl.classList.remove('hide')};
 rec.start();mic.textContent='⏹️';rb.innerHTML=S.stop.pon+' / '+S.stop.en}
async function upload(w,L){if(!blob||!C.SUBMIT_ENABLED||/PLACEHOLDER/.test(C.CLOUD_NAME+C.UPLOAD_PRESET))return'';const f=new FormData(),ts=Date.now();
 f.append('file',blob);f.append('upload_preset',C.UPLOAD_PRESET);f.append('folder','pohnpeian_words');
 f.append('public_id',`${w.id}_${(area.value||'na').replace(/\W/g,'')}_${ts}`);f.append('context',`word_id=${w.id}|area=${area.value}|lang=${L}|ts=${ts}|batch=${BATCH}`);
 try{const r=await fetch(`https://api.cloudinary.com/v1_1/${C.CLOUD_NAME}/video/upload`,{method:'POST',body:f});return (await r.json()).secure_url||''}catch(e){return''}}
async function next(){const w=W[i],p=pon.value.trim(),L=cl.value==='Other'?(lo.value.trim()||'Other'):cl.value,px=L==='Pohnpeian'?'':`[lang: ${L}] `;if(p||ans.right||blob){const a=await upload(w,L);
 post({id:w.id,en:w.en,pon:px+p+(a?` [audio: ${a}]`:''),right:ans.right});if(!w.sug&&p&&!px)named++;if(p)mine++}
 i++;i<W.length?show():fin()}
function fin(){pb.style.width='100%';quiz.classList.add('hide');done.classList.remove('hide');overall2.innerHTML=`<b style="font-size:1.3em">${S.named_n.pon.replace('{n}',mine)}<br>${S.named_n.en.replace('{n}',mine)}</b><br>`+ov();for(let k=0;k<40;k++){const e=document.createElement('div');e.className='cf';e.textContent='🎉🌺🍍🥥🍌⭐'[k%6]||'🎉';e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4000)}}
function share(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(URL_),'_blank')}
function copyL(){navigator.clipboard.writeText(URL_).then(()=>cp.innerHTML=bi('copied'))}
function fb(){const t=fbt.value.trim();if(!t)return;post({id:'PAGE_FEEDBACK',en:'page feedback',pon:t,right:''});fbt.value='';fbb.innerHTML=bi('thanks')}
</script></body></html>
